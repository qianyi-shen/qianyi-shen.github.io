{% if include.item.authors %}
<p class="publication-authors">
  {% for person in include.item.authors %}{% if person.self %}<strong>{{ person.name | escape }}</strong>{% else %}{{ person.name | escape }}{% endif %}{% if person.corresponding %}<sup title="{% if include.item.title_lang == 'zh-CN' %}通讯作者{% else %}Corresponding author{% endif %}">†</sup>{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}
</p>
{% endif %}
