# Basic Site Settings
locale                   : "en-US"
title                    : "Qianyi Shen"
title_separator          : "-"
name                     : &name "Qianyi Shen"
description              : &description "Qianyi Shen, Ph.D. student at Tongji University. Vehicle motion control, learning-based model predictive control and chassis control."
url                      : https://qianyi-shen.github.io
baseurl                  : ""
repository               : "https://github.com/qianyi-shen/qianyi-shen.github.io"

# Site Author
author:
  avatar           : "profile-avatar.jpg"
  name             : "Qianyi Shen"
  pronouns         : "he/him/his"
  bio              : "Ph.D. student"
  location         : "Shanghai, China"
  employer         : "Tongji University"
  email            : "qyshen@tongji.edu.cn"
  wechat           : "WeChat"
  wechat_qr        : "wechat-qr.jpg"

  googlescholar    : "https://scholar.google.com/citations?user=nIqW0qsAAAAJ&hl=en"
  orcid            : "https://orcid.org/0009-0008-0746-3135"

  github           : "EthanQY"

  instagram        : "qethanshen"

# Publication Category
publication_category:
  manuscripts:
    title: 'Journal Articles'
  conference_articles:
    title: 'Conference Articles'
  patents:
    title: 'Patents'
  dissertations:
    title: 'Dissertations'

# Site Settings
words_per_minute         : 160
cjk_characters_per_minute: 275
future                   : true

# Structured data profiles
social:
  type                   : Person
  name                   : *name
  links:
    - https://scholar.google.com/citations?user=nIqW0qsAAAAJ&hl=en
    - https://orcid.org/0009-0008-0746-3135
    - https://github.com/EthanQY
    - https://www.instagram.com/qethanshen/

# Public visit counter
visit_counter:
  provider               : "goatcounter"
  site_code              : "qianyi-shen"
  production_host        : "qianyi-shen.github.io"
  legacy_count           : 878

# Reading Files
include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .pnpm-store
  - .sass-cache
  - .superpowers
  - .worktrees
  - AGENTS.md
  - assets/js/_main.js
  - assets/js/plugins
  - docs/superpowers
  - Gemfile
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - README
  - tests
  - tmp
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-sitemap

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
